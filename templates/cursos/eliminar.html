{% extends "layout.html" %}
{% block container %}
<div class="max-w-md mx-auto p-10 bg-white rounded-3xl shadow-2xl mt-20 text-center">
    <h2 class="text-2xl font-black text-red-600 mb-4">¿Eliminar Curso?</h2>
    <p class="mb-8 text-gray-600">Estás por eliminar <strong>{{ curso.nombre }}</strong>. Esto también cancelará las inscripciones de los alumnos.</p>
    
    <form method="POST">
        <button type="submit" class="bg-red-600 text-white px-8 py-3 rounded-xl font-bold w-full mb-4">SÍ, ELIMINAR</button>
        <a href="{{ url_for('cursos.index') }}" class="block text-gray-400 font-bold">CANCELAR</a>
    </form>
</div>
{% endblock %}
